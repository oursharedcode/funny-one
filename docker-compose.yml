# Funny Family «Чепуха 37» — self-hosted Docker Compose (T-8.1, FM-NFR-3).
# Reads its env vars from a .env file next to this file (the repo root, or
# the remote dir deploy/ship.sh copies it to). See .env.example / DEPLOYMENT.md.
#
# BASE_PATH (requirements D-5) is the one value that has to reach two places:
# the image build (the client bakes it in) and the running server. Compose
# reads it from .env for the `${…}` substitutions below, so setting it once
# there keeps both in step. Unset means "/" — served at the root, which is
# what the Caddy profile below requires (the game owns its host, B-1a).
#
# Two ways to run this file:
#   docker compose up -d                  the game only, plain HTTP on :3000;
#                                         put your own TLS proxy in front.
#   docker compose --profile caddy up -d  the game plus Caddy on :80/:443 with
#                                         automatic HTTPS — what production
#                                         runs (deploy/caddy/Caddyfile). Needs
#                                         FM_HOST, FM_APEX, FO_HOST, FO_APEX,
#                                         SITE_HOST, SITE_APEX, HUB_HOST and
#                                         HUB_APEX in .env and DNS for all
#                                         eight pointing at this host.
services:
  funny-multi:
    build:
      context: .
      args:
        BASE_PATH: ${BASE_PATH:-/}
    image: funny-multi:latest
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      BASE_PATH: ${BASE_PATH:-/}
      # The landing page's and the game's visit counts (Step 72, the server's
      # analytics.ts): kept in a volume, so a deploy does not reset them.
      STATS_FILE: /data/stats.json
    volumes:
      - stats_data:/data
    restart: unless-stopped

  caddy:
    profiles: [caddy]
    image: caddy:2
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Static files served straight by Caddy — Funny One's bundle lands in
      # ./static/funny-one, its privacy policy and assetlinks.json in
      # ./static/funny1-root and the service worker its former address answers
      # with in ./static/funny1-retired (all deploy/ship-funny-one.sh); Funny
      # Multi's privacy policy and assetlinks.json in ./static/funny37-root
      # (deploy/ship.sh); the landing page in ./static/funny-family
      # (deploy/ship-funny-family.sh).
      # The parent directory is mounted, not each subdirectory, so the
      # scripts' swap of a directory is visible here without restarting
      # Caddy: a bind mount pins the inode it started with.
      - ./static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    # Plain `${VAR}` rather than the `:?` required form: Compose interpolates
    # the whole file before it applies profiles, so a hard requirement here
    # would break the profile-less `docker compose up`. An empty host fails
    # loudly anyway — Caddy refuses a Caddyfile with an empty site name.
    # BASE_PATH is not passed on: the Caddyfile no longer reads it.
    environment:
      FM_HOST: ${FM_HOST:-}
      FM_APEX: ${FM_APEX:-}
      FO_HOST: ${FO_HOST:-}
      FO_APEX: ${FO_APEX:-}
      SITE_HOST: ${SITE_HOST:-}
      SITE_APEX: ${SITE_APEX:-}
      HUB_HOST: ${HUB_HOST:-}
      HUB_APEX: ${HUB_APEX:-}
    depends_on:
      - funny-multi
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  stats_data:
