# Funny Family «Чепуха 37» — self-hosted Docker Compose (T-8.1, FM-NFR-3).
# Reads its env vars from a .env file next to this file (the repo root, or
# the remote dir deploy/ship.sh copies it to). See .env.example / DEPLOYMENT.md.
#
# BASE_PATH (requirements D-5) is the one value that has to reach two places:
# the image build (the client bakes it in) and the running server. Compose
# reads it from .env for the `${…}` substitutions below, so setting it once
# there keeps both in step. Unset means "/" — served at the root.
#
# Two ways to run this file:
#   docker compose up -d                  the game only, plain HTTP on :3000;
#                                         put your own TLS proxy in front.
#   docker compose --profile caddy up -d  the game plus Caddy on :80/:443 with
#                                         automatic HTTPS — what production
#                                         runs (deploy/caddy/Caddyfile). Needs
#                                         SITE_HOST and SITE_APEX in .env and
#                                         DNS for both pointing at this host.
services:
  funny-multi:
    build:
      context: .
      args:
        BASE_PATH: ${BASE_PATH:-/}
    image: funny-multi:latest
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      BASE_PATH: ${BASE_PATH:-/}
    restart: unless-stopped

  caddy:
    profiles: [caddy]
    image: caddy:2
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Static games served straight by Caddy — Funny One's bundle lands in
      # ./static/funny-one (deploy/ship-funny-one.sh). The parent directory is
      # mounted, not funny-one itself, so the script's swap of that directory
      # is visible here without restarting Caddy: a bind mount pins the
      # inode it started with.
      - ./static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    # Plain `${VAR}` rather than the `:?` required form: Compose interpolates
    # the whole file before it applies profiles, so a hard requirement here
    # would break the profile-less `docker compose up`. An empty SITE_HOST
    # fails loudly anyway — Caddy refuses a Caddyfile with an empty site name.
    environment:
      SITE_HOST: ${SITE_HOST:-}
      SITE_APEX: ${SITE_APEX:-}
      BASE_PATH: ${BASE_PATH:-}
    depends_on:
      - funny-multi
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
