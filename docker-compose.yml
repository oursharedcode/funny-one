# Funny Family «Чепуха 37» — self-hosted Docker Compose (T-8.1, FM-NFR-3).
# Reads the same env vars as the Render service from a .env file at the repo
# root. Copy .env.example to .env and fill it in before `docker compose up`.
services:
  funny-multi:
    build: .
    image: funny-multi:latest
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
