name = "funny-multi-image"
main = "worker.js"
compatibility_date = "2026-08-13"
# Disables per-VERSION preview aliases (<prefix>-<name>.<subdomain>.workers.dev),
# a separate Cloudflare feature from the workers.dev route itself. Not needed
# here since deploys are not versioned/aliased.
#
# The main *.workers.dev route stays enabled (default) — it IS the URL that
# becomes CLOUDFLARE_WORKER_URL below. SRC's own security doc is explicit that
# this is fine: the URL gives zero security either way (it is knowable from
# the public repo's Worker name), and the shared secret (X-Secret / WORKER_
# SECRET) is the entire boundary, same as every other route except /i/*.
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true

# Workers AI — THE GENERATION SWITCH. Commented out = off: the Worker serves
# every picture already in R2 and answers a miss with 503 (worker.js: `if
# (!env.AI)`), so nothing can spend Neurons — not even a caller holding
# WORKER_SECRET. `/stats` reports the state as `generation`.
#
# Off here because production's library is complete (design §10.1, all 10⁴
# pictures in R2 since 2026-10-02) and a paid Workers AI plan has no spending
# cap: the shared secret would otherwise be the only thing between a leak and
# the bill.
#
# A fresh deployment has an empty bucket and needs it ON to get any pictures:
# uncomment the block, `wrangler deploy`, and either run the pre-generation
# batch (DEPLOYMENT.md) or let the cache fill as people play. Comment it out and
# deploy again once the library is complete — and switch it back on for the
# batch after any pool edit.
#
# Off also keeps Funny Multi's Play app outside Google Play's AI-Generated
# Content policy, which leaves out apps that only host AI pictures. On, the app
# draws from players' stories and needs an in-app "report this picture" first
# (store/funny-multi/answers.md, item 7; Step 87).
#
# [ai]
# binding = "AI"

# R2 — REQUIRED. The image cache itself (design §7.2): one generation per
# distinct story for the whole world, and the reason a repeated story reveals
# instantly. Without this binding /generate cannot store and /i/ cannot serve.
#
# Unlike the KV block below, this is safe to ship uncommented: a bucket *name*
# is scoped to whichever account runs `wrangler deploy`, so no id from someone
# else's account is baked in here. Create it once, in your own account:
#
#   wrangler r2 bucket create funny-multi-images
#
# The free tier (10 GB stored, 1 M writes/month) is far above our usage — a
# Flux Schnell frame is ~100 KB, so 10 GB is ~100 000 distinct stories, and the
# cache converges long before that (design §4).
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "funny-multi-images"

# Workers KV — OPTIONAL. Persists the daily image counter across Worker
# isolate recycles and game-server restarts. The server's in-memory counter
# resets on each cold start; this KV namespace is the cross-process source
# of truth.
#
# Left commented out by default so a fresh `wrangler deploy` works for ANY account: a
# KV `id` belongs to the account that created it, so a hard-coded id from
# another account makes `wrangler deploy` fail with "namespace not valid". The
# Worker treats STATS_KV as optional (see worker.js: `if (!env.STATS_KV)`) and
# runs fine without it — only the cross-cold-start "Images today" counter is
# lost.
#
# To enable persistent stats in YOUR account (one-time):
#   wrangler kv namespace create STATS_KV            # prints your id
#   wrangler kv namespace create STATS_KV --preview  # prints your preview_id
# then uncomment the block below and paste YOUR returned ids. The free tier
# (1 000 writes/day per key, 100 000 reads/day) is far above our usage.
#
# [[kv_namespaces]]
# binding = "STATS_KV"
# id = "<your-namespace-id>"
# preview_id = "<your-preview-namespace-id>"

# Set WORKER_SECRET via: wrangler secret put WORKER_SECRET
# Then set the same value as CLOUDFLARE_WORKER_SECRET in the game server's .env.
