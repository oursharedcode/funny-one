<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Funny Multi">
  <!--
    Hand-authored placeholder app icon standing in for commissioned artwork
    (Phase 8 polish item). Digits are drawn as stroked paths, not <text>, so
    the icon rasterizes identically everywhere — text relying on a webfont
    (e.g. Fredoka) silently falls back to a system font when rasterized
    outside a page context, which is exactly the bug this replaces. The "37"
    of «Чепуха 37» (FM-ID-1, the 3-7 player range) on the brand-cream ground.
    Maskable-safe: all foreground content sits inside the middle 80% (the
    circle, r=180, and the digits within it).
  -->
  <rect width="512" height="512" fill="#fef3c7" />
  <circle cx="256" cy="256" r="180" fill="#ec4899" />
  <path
    d="M 150 196 C 150 166 226 154 244 190 C 262 226 230 262 198 264 C 230 266 266 288 246 328 C 224 366 150 356 144 322"
    fill="none"
    stroke="#ffffff"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 268 190 L 368 190 L 288 336"
    fill="none"
    stroke="#ffffff"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
